{% extends 'base.html' %}

{% block content %}
<style>
main { padding: 0 !important; }
.error-page {
    width: 100%;
    min-height: calc(100vh - 12rem);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
}
.error-card {
    width: 100%;
    max-width: 560px;
    background: var(--surface-bg);
    color: var(--text-main);
    border: 1px solid var(--panel-border);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 1.5rem;
    text-align: center;
    backdrop-filter: blur(18px);
}
@media (min-width: 640px) {
    .error-card { padding: 2rem; border-radius: 28px; }
}
</style>

<div class="error-page">
    <article class="error-card">
        <p class="text-xs sm:text-sm uppercase tracking-[0.35em] font-semibold" style="color: var(--text-soft);">Erreur 404</p>
        <h1 class="mt-3 text-3xl sm:text-4xl font-black" style="color: var(--text-main);">Oups, cette page n’existe pas.</h1>
        <p class="mt-3 text-sm sm:text-base" style="color: var(--text-soft);">La page que vous cherchez a peut-être été déplacée, supprimée ou n’a jamais existé.</p>
        <div class="mt-6 flex flex-wrap items-center justify-center gap-3">
            <a href="{{ url_for('index') }}" class="rounded-full bg-purple-900 px-4 py-2 text-sm font-semibold text-white hover:bg-violet-800 transition">Retour à l’accueil</a>
            <a href="{{ url_for('login') if not utilisateur else url_for('publier') }}" class="rounded-full border border-white/10 px-4 py-2 text-sm font-semibold transition" style="color: var(--text-main); background: var(--surface-card);">{{ 'Se connecter' if not utilisateur else 'Publier un article' }}</a>
        </div>
    </article>
</div>
{% endblock %}
