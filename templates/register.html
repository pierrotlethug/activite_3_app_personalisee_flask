{% extends 'base.html' %}

{% block content %}
<style>
html, body { overflow: hidden; }
main { padding: 0 !important; }
.register-page {
    width: 100%;
    min-height: calc(100vh - 12rem);
    max-height: calc(100vh - 12rem);
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    padding: 1rem;
}
@media (min-width: 640px) {
    .register-page { padding: 2rem; }
}
.form-container {
    width: 100%;
    max-width: 420px;
    background: var(--surface-bg);
    color: var(--text-main);
    padding: 1.5rem;
    border-radius: 1rem;
    border: 1px solid var(--panel-border);
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px);
}
@media (min-width: 640px) {
    .form-container { padding: 2.5rem; border-radius: 1.25rem; }
}
.form-title {
    font-weight: bold;
    font-size: 1.75rem;
    margin-bottom: 0.5rem;
    text-align: center;
    color: #5b21b6;
    letter-spacing: 0.05em;
    width: 100%;
}
@media (min-width: 640px) {
    .form-title { font-size: 2.25rem; }
}
.form-subtitle {
    text-align: center;
    color: #6b7280;
    margin-bottom: 1.5rem;
    width: 100%;
    font-size: 0.95rem;
}
@media (min-width: 640px) {
    .form-subtitle { margin-bottom: 2rem; }
}
.form-group {
    margin-bottom: 1rem;
    width: 100%;
}
@media (min-width: 640px) {
    .form-group { margin-bottom: 1.5rem; }
}
.form-label {
    display: block;
    font-size: 0.9rem;
    color: var(--text-soft);
    font-weight: 600;
    margin-bottom: 0.35rem;
}
@media (min-width: 640px) {
    .form-label { font-size: 0.95rem; margin-bottom: 0.5rem; }
}
.form-input {
    background: #f3f4f6;
    color: #111827;
    caret-color: #111827;
    width: 100%;
    padding: 0.65rem;
    border: 1px solid #fcd34d;
    border-radius: 0.4rem;
    outline: none;
    font-size: 0.9rem;
}
@media (min-width: 640px) {
    .form-input { padding: 0.75rem; border-radius: 0.5rem; font-size: 1rem; }
}
.form-error {
    margin-bottom: 0.75rem;
    width: 100%;
    display: flex;
    justify-content: center;
}
@media (min-width: 640px) {
    .form-error { margin-bottom: 1rem; }
}
.error-message {
    font-size: 0.95rem;
    color: #b91c1c;
    text-align: center;
    font-weight: 600;
    background: #fee2e2;
    border: 1px solid #fca5a5;
    border-radius: 0.4rem;
    padding: 0.4rem 0.75rem;
    width: 100%;
}
@media (min-width: 640px) {
    .error-message { font-size: 1.1rem; padding: 0.5rem 1rem; border-radius: 0.5rem; }
}
.form-button {
    background: linear-gradient(135deg, #3900f6 0%, #e300df 100%);
    color: white;
    font-weight: bold;
    border-radius: 0.6rem;
    padding: 0.6rem 0;
    width: 100%;
    font-size: 1rem;
    box-shadow: 0 2px 8px 0 rgba(251,191,36,0.15);
    border: none;
    transition: background 0.2s;
    cursor: pointer;
    margin-top: 1rem;
}
@media (min-width: 640px) {
    .form-button { border-radius: 0.75rem; padding: 0.75rem 0; font-size: 1.15rem; margin-top: 1.5rem; }
}
.form-button:hover {
    background: linear-gradient(135deg, #e300df 0%, #3900f6 100%);
}
</style>
<div class="register-page">
    <form method="POST" action="{{ url_for('register') }}" class="form-container flex flex-col items-center">
        <h1 class="form-title">Créer un compte</h1>
        <p class="form-subtitle">Remplissez les champs suivants pour vous inscrire.</p>
        <div class="form-group">
            <label for="utilisateur" class="form-label">Nom d'utilisateur</label>
            <input name="utilisateur" id="utilisateur" placeholder="Nom d'utilisateur" required class="form-input">
        </div>
        <div class="form-group">
            <label for="mot_de_passe" class="form-label">Mot de passe</label>
            <input name="mot_de_passe" id="mot_de_passe" type="password" placeholder="Mot de passe" required class="form-input">
        </div>
        <div class="form-group">
            <label for="verif_mot_de_passe" class="form-label">Vérification mot de passe</label>
            <input name="verif_mot_de_passe" id="verif_mot_de_passe" type="password" placeholder="Confirmez le mot de passe" required class="form-input">
        </div>
        {% if erreur %}
            <div class="form-error">
                <p class="error-message"><strong>Erreur :</strong> {{ erreur }}</p>
            </div>
        {% endif %}
        <button type="submit" class="form-button">S'inscrire</button>
    </form>
</div>
{% endblock %}
